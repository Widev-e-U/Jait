[package]
name = "jait-contract"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "jait-contract"

[[bin]]
name = "jait-local-deploy"
path = "../../packages/gateway-rust/src/bin/jait-local-deploy.rs"

[[bin]]
name = "gateway-native"
path = "../../packages/gateway-rust/src/main.rs"

[dependencies]
hex = "0.4"
sha2 = "0.10"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
jait-gateway = { path = "../../packages/gateway-rust" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
anyhow = "1.0"
ctrlc = { version = "3.5", features = ["termination"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
uuid = { version = "1.0", features = ["v4"] }

[profile.dev]
debug = 0

[dev-dependencies]
hmac = "0.12"
jiff = { version = "0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
base64 = "0.22"
ed25519-dalek = "2"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1.0", features = ["test-util"] }
