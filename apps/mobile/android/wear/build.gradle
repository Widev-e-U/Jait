apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

def releasePackageJson = new JsonSlurper().parse(file('../../../../packages/gateway/package.json'))
def releaseVersionName = releasePackageJson.version as String
def releaseVersionParts = releaseVersionName.tokenize('.').collect { it.toInteger() }
def releaseVersionCode = (releaseVersionParts[0] * 1000000) +
    (releaseVersionParts[1] * 1000) +
    releaseVersionParts[2]

android {
    namespace "dev.jait.mobile.wear"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.jait.mobile.wear"
        minSdkVersion 28
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('JAIT_ANDROID_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storeType 'PKCS12'
                storePassword System.getenv('JAIT_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JAIT_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('JAIT_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.wear:wear:1.3.0"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"

    testImplementation "junit:junit:4.13.2"
}
