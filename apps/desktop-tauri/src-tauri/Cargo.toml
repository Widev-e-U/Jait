[package]
name = "jait-desktop-app"
version = "0.1.0"
edition = "2021"
description = "Jait desktop shell (Tauri v2 adapter over electron-main-parity core)"

[lib]
name = "jait_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "jait-desktop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
jait-desktop-core = { path = "../crates/jait-desktop-core" }
jait-desktop-glue = { path = "../crates/jait-desktop-glue" }
tauri = { version = "2", features = ["tray-icon", "devtools"], optional = true }
tauri-plugin-opener = { version = "2.0", optional = true }
tauri-plugin-clipboard-manager = { version = "2.0", optional = true }
tauri-plugin-dialog = { version = "2.0", optional = true }
tauri-plugin-notification = { version = "2.0", optional = true }
tauri-plugin-os = { version = "2.0", optional = true }

[dev-dependencies]
tempfile = "3"

# Standalone crate (deliberately outside apps/desktop-tauri workspace so
# machines without webkit2gtk dev headers can still build/test the core).

[features]
default = []
# `shell` pulls in the full Tauri runtime (needs platform webview dev
# headers); plain `cargo test` compiles the tauri-free glue + core so
# machines without webkit2gtk still build/test everything else.
shell = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-os"]
# `frontend` wires tauri.conf.json frontendDist to the real renderer build.
frontend = []