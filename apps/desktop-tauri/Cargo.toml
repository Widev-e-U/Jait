[workspace]
resolver = "2"
members = ["crates/jait-desktop-core", "crates/jait-desktop-glue"]
exclude = ["src-tauri"]
# NOTE: `src-tauri` (the Tauri v2 shell) is kept OUT of this workspace because
# compiling Tauri on Linux requires system libraries not present on the dev
# container (libwebkit2gtk-4.1-dev, pkg-config). It is a standalone crate —
# see src-tauri/README.md. CI and release machines build it separately.

[workspace.package]
version = "0.1.782"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
dirs = "5"
keyring = "3"
regex = "1"
ignore = "0.4"
walkdir = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true