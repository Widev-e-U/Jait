name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release version source check
        run: bun run release:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          # Vite's production build of apps/web needs a ~6-8GB heap. Without a
          # cap V8 grows unbounded and the kernel OOM-kills the build (exit
          # 137) on the memory-tight self-hosted runner (v0.1.877-v0.1.878).
          NODE_OPTIONS: --max-old-space-size=8192
        # All self-hosted Linux runners share one memory-limited host.
        # Serialize Vite builds across CI and release jobs, and ride out
        # transient OOM kills (host pressure from off-runner processes) with
        # the same 3-attempt retry the Release workflow uses.
        run: |
          for attempt in 1 2 3; do
            if flock /tmp/jait-vite-build.lock bun run build; then
              exit 0
            else
              status=$?
            fi
            if [ "$status" -eq 137 ] || [ "$status" -eq 134 ]; then
              echo "⏳ attempt $attempt/3 — build killed (exit $status, OOM); waiting 2 min for host memory to clear"
              sleep 120
            else
              echo "❌ build failed with non-OOM exit $status — not retrying"
              exit "$status"
            fi
          done
          echo "::error::build was OOM-killed on all 3 attempts"
          exit 137

      - name: Test
        run: bun run test

      - name: Install browser tool test runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/jait-tool-test-browsers
        run: node packages/gateway/node_modules/playwright/cli.js install chromium

      - name: Test browser tools with real Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/jait-tool-test-browsers
        run: bun run test:tools:browser

      - name: Lint
        run: bun run lint
