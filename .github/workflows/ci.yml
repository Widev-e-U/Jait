name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Release version source check
        run: bun run release:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        env:
          # Vite's production build of apps/web needs a ~6-8GB heap. Without a
          # cap V8 grows unbounded and the kernel OOM-kills the build (exit
          # 137) on the memory-tight self-hosted runner (v0.1.877-v0.1.878).
          NODE_OPTIONS: --max-old-space-size=8192
        # All self-hosted Linux runners share one memory-limited host.
        # Serialize Vite builds across CI and release jobs.
        run: flock /tmp/jait-vite-build.lock bun run build

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint
