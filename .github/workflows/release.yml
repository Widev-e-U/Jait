# ──────────────────────────────────────────────────────────────────────────────
# Release workflow — auto-tag + publish + build
# ──────────────────────────────────────────────────────────────────────────────
# HOW IT WORKS:
#   1. On every push to main that touches any watched package.json
#      (gateway, shared, web), the "auto-tag" job checks if any version
#      field changed.
#   2. If it changed, a v<version> git tag is created.
#   3. All downstream jobs (npm publish, desktop builds, Android APK,
#      GitHub Release) run only when a new tag was created.
#   4. Can also be triggered manually or by pushing a v* tag directly.
#
# TO RELEASE A NEW VERSION:
#   1. Bump "version" in packages/gateway/package.json (and optionally
#      the other sub-packages if their code changed).
#   2. Commit and push to main.
#   3. This workflow handles everything: tag → npm publish → builds → release.
#
# NOTES:
#   - No manual `git tag` or `npm publish` is needed.
#   - The gateway version in packages/gateway/package.json is the single
#     source of truth for monorepo release versions.
#   - If a tag already exists, the auto-tag step is a no-op.
#   - workflow_dispatch and v* tag pushes skip the auto-tag job and go
#     straight to publish/build.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/gateway/package.json
      - packages/shared/package.json
      - apps/web/package.json
      - packages/screen-share/package.json
      - apps/mobile/package.json
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_asset_mode:
        description: "How to move build outputs into the release job"
        required: false
        default: runner
        type: choice
        options:
          - runner
          - github-artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Unique top-level dir per run. The previous shared parent
  # (/tmp/jait-release-assets) was created root-owned on the shared
  # self-hosted runner, so non-root jobs failed at `mkdir -p`.
  # /tmp itself is world-writable, and ${RUN_ID} avoids collisions.
  # NOTE: cannot use ${{ runner.temp }} here — the runner context is not
  # available in workflow-level env and breaks workflow parsing.
  RELEASE_ASSET_DIR: /tmp/jait-release-assets-run-${{ github.run_id }}
  RELEASE_ASSET_MODE: ${{ inputs.release_asset_mode || 'runner' }}
  RELEASE_ASSET_RETENTION_DAYS: 1

permissions:
  contents: write
  packages: write

jobs:
  # ── Auto-tag on version bump (only on branch push, not tag push) ───
  auto-tag:
    name: Auto-tag if version changed
    runs-on: [self-hosted, linux]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.push-tag.outputs.tagged || 'false' }}
      changed: ${{ steps.version.outputs.changed || 'false' }}
      version: ${{ steps.version.outputs.version || '' }}
      gateway_changed: ${{ steps.version.outputs.gateway_changed || 'false' }}
      shared_changed: ${{ steps.version.outputs.shared_changed || 'false' }}
      web_changed: ${{ steps.version.outputs.web_changed || 'false' }}
      screen_share_changed: ${{ steps.version.outputs.screen_share_changed || 'false' }}
      mobile_changed: ${{ steps.version.outputs.mobile_changed || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: version
        run: |
          # Gateway version is always the tag source
          GW_VERSION=$(jq -r '.version' packages/gateway/package.json)
          echo "gateway=$GW_VERSION"

          # Check if ANY watched package.json version changed
          CHANGED=false
          GATEWAY_CHANGED=false
          SHARED_CHANGED=false
          WEB_CHANGED=false
          SCREEN_SHARE_CHANGED=false
          MOBILE_CHANGED=false
          for PKG in packages/gateway/package.json packages/shared/package.json apps/web/package.json packages/screen-share/package.json apps/mobile/package.json; do
            NEW=$(jq -r '.version' "$PKG" 2>/dev/null || echo "")
            OLD=$(git show HEAD~1:"$PKG" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
            if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then
              echo "$PKG changed: $OLD → $NEW"
              CHANGED=true
              case "$PKG" in
                packages/gateway/package.json) GATEWAY_CHANGED=true ;;
                packages/shared/package.json) SHARED_CHANGED=true ;;
                apps/web/package.json) WEB_CHANGED=true ;;
                packages/screen-share/package.json) SCREEN_SHARE_CHANGED=true ;;
                apps/mobile/package.json) MOBILE_CHANGED=true ;;
              esac
            fi
          done

          echo "gateway_changed=$GATEWAY_CHANGED" >> $GITHUB_OUTPUT
          echo "shared_changed=$SHARED_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "screen_share_changed=$SCREEN_SHARE_CHANGED" >> $GITHUB_OUTPUT
          echo "mobile_changed=$MOBILE_CHANGED" >> $GITHUB_OUTPUT

          if [ "$CHANGED" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$GW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check tag doesn't already exist
        if: steps.version.outputs.changed == 'true'
        id: check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if bash .github/scripts/release-git.sh tag-exists "$TAG"; then
            echo "Tag $TAG already exists — skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            STATUS=$?
            if [ "$STATUS" -eq 1 ]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Unable to verify whether tag $TAG exists"
              exit "$STATUS"
            fi
          fi

      - name: Create and push tag
        id: push-tag
        if: steps.version.outputs.changed == 'true' && steps.check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          bash .github/scripts/release-git.sh push-tag "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "✅ Tagged $TAG"

  # ── Desktop shell (Windows NSIS setup.exe built via cargo-xwin) ────
  # Mirror-tested in the tauri-cicd container: cargo tauri build --runner
  # cargo-xwin --target
  # x86_64-pc-windows-msvc --bundles nsis (needs llvm-rc for resource
  # embedding and makensis for the installer).
  desktop-gateway-runtime:
    name: "Package Windows gateway runtime"
    runs-on: windows-latest
    needs: [auto-tag]
    if: |
      always() && (
        needs.auto-tag.outputs.changed == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
      && (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        needs.auto-tag.outputs.changed == 'true'
      )
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gateway distribution
        env:
          JAIT_HOSTING_TEST_RESOURCES: ${{ github.workspace }}/apps/desktop/src-tauri/gateway
          JAIT_GRAPHIFY_COMMAND: __jait_smoke_no_optional_python__
        run: |
          bun install --frozen-lockfile
          bun run --filter @jait/shared build
          bun run --filter @jait/screen-share build
          bun run --filter @jait/api-client build
          bun run --filter @jait/ui-shared build
          bun run --filter @jait/gateway build
          node packages/gateway/scripts/package-desktop.mjs
          node packages/gateway/scripts/smoke-desktop.mjs
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml packaged_runtime_lifecycle -- --ignored
          tar -czf desktop-gateway.tar.gz -C apps/desktop/src-tauri gateway
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-gateway-runtime
          path: desktop-gateway.tar.gz
          retention-days: 3

  desktop:
    name: "Desktop Build (Windows setup.exe)"
    runs-on: [self-hosted, linux]
    needs: [auto-tag, desktop-gateway-runtime]
    if: |
      always() && (
        needs.auto-tag.outputs.changed == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
      && (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        needs.auto-tag.outputs.changed == 'true'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Prepare release asset directory
        run: mkdir -p "$RELEASE_ASSET_DIR"
      - name: Stamp desktop version with release version
        run: |
          # The Tauri shell embeds the web frontend, so it must ship a new
          # build on every gateway release. Stamp tauri.conf.json with the
          # release version so the NSIS installer carries it.
          if [ -n "${{ needs.auto-tag.outputs.version }}" ]; then
            REL_VERSION="${{ needs.auto-tag.outputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REL_VERSION="${GITHUB_REF_NAME#v}"
          else
            REL_VERSION=$(jq -r '.version' packages/gateway/package.json)
          fi
          echo "Stamping desktop version -> $REL_VERSION"
          jq --arg v "$REL_VERSION" '.version = $v' \
            apps/desktop/src-tauri/tauri.conf.json > tmp.json \
            && mv tmp.json apps/desktop/src-tauri/tauri.conf.json
          echo "desktop_release_version=$REL_VERSION" >> $GITHUB_ENV
      - name: Build Tauri frontend
        run: |
          bun install --frozen-lockfile
          bun run --filter @jait/shared build
          bun run --filter @jait/api-client build
          bun run --filter @jait/ui-shared build
          (
            cd apps/web
            NODE_OPTIONS=--max-old-space-size=4096 bunx vite build --base ./ --sourcemap false
          )
          test -s apps/web/dist/index.html
      - uses: actions/download-artifact@v4
        with:
          name: desktop-gateway-runtime
          path: desktop-gateway-artifact
      - name: Unpack gateway runtime
        run: tar -xzf desktop-gateway-artifact/desktop-gateway.tar.gz -C apps/desktop/src-tauri
      - name: Ensure Tauri Windows cross toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          # Fetch + extract deb packages into $HOME/.local (no passwordless
          # sudo on this runner; Ubuntu 24.04 noble package set, mirroring
          # the locally-tested tauri-cicd container toolchain).
          userspace_fetch_debs() {
            mkdir -p "$HOME/.local" /tmp/jait-ci-debs
            (cd /tmp/jait-ci-debs \
              && apt-get update -qq 2>/dev/null || true
              apt-get download "$@" \
              && for d in ./*.deb; do dpkg-deb -x "$d" "$HOME/.local/"; done \
              && rm -f ./*.deb)
          }

          userspace_install() {
            # Env wiring must run on EVERY call (cached or fresh): GITHUB_ENV
            # exports do not survive to the next run, but the on-disk marker
            # does (self-hosted runner), so a cached run would otherwise skip
            # them and makensis would fall back to its compiled-in
            # /usr/share/nsis ("Error: reading stub"). GITHUB_PATH duplicates
            # are harmless.
            echo "$HOME/.local/usr/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$HOME/.local/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            local marker="$HOME/.local/.jait-desktop-ci-tools"
            if [ -f "$marker" ]; then
              echo "userspace toolchain already installed at $HOME/.local"
            else
              userspace_fetch_debs nsis nsis-common llvm-18 libllvm18 clang-18 libclang-cpp18
              printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/../lib/llvm-18/bin/clang-18" "$@"\n' \
                > "$HOME/.local/usr/bin/clang"
              chmod +x "$HOME/.local/usr/bin/clang"
              date -Iseconds > "$marker"
            fi
            export PATH="$HOME/.local/usr/bin:$HOME/.local/usr/lib/llvm-18/bin:$PATH"
            export LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            # makensis ignores NSISDIR — the relocation fix is the
            # NSIS path-redirect LD_PRELOAD shim (see ci/libnsisredirect.c),
            # wired by the "Build NSIS path-redirect shim" step below.
            export NSIS_REAL_DIR="$HOME/.local/usr/share/nsis"
          }

          apt_install() {
            if command -v sudo &>/dev/null && sudo -n true 2>/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y "$@"
            elif [ "$(id -u)" -eq 0 ]; then
              apt-get update -qq && apt-get install -y "$@"
            else
              echo "::warning::no root on runner ($*); installing to \$HOME/.local via deb extraction."
              userspace_install
            fi
          }

          # NSIS (makensis) — Tauri's NSIS bundler.
          command -v makensis &>/dev/null || apt_install nsis
          # LLVM — tauri-winres needs llvm-rc to embed icons/resources.
          command -v llvm-rc &>/dev/null || apt_install llvm clang

          # pkgconf — tauri-cli probes pkg-config for the Linux tray libraries
          # (ayatana/libappindicator) whenever the app enables tray-icon — even
          # for Windows NSIS cross builds — and aborts when the probe cannot
          # run or resolve.
          ensure_pkgconfig() {
            if command -v pkg-config &>/dev/null || command -v pkgconf &>/dev/null; then
              echo "pkg-config found: $(command -v pkg-config || command -v pkgconf)"
            elif [ -x "$HOME/.local/usr/bin/pkgconf" ]; then
              export PATH="$HOME/.local/usr/bin:$PATH"
              echo "using userspace pkgconf: $HOME/.local/usr/bin/pkgconf"
            else
              echo "$HOME/.local/usr/bin" >> "$GITHUB_PATH"
              # pkgconf = conventional pkg-config shim, pkgconf-bin = binary,
              # libpkgconf3 = runtime lib for the extracted binary.
              userspace_fetch_debs pkgconf pkgconf-bin libpkgconf3
              export PATH="$HOME/.local/usr/bin:$PATH"
              echo "installed userspace pkgconf $(pkgconf --version)"
            fi
            # The extracted pkgconf binary links against libpkgconf.so.3 in the
            # userspace prefix.
            case ":$LD_LIBRARY_PATH:" in
              *"$HOME/.local/usr/lib/x86_64-linux-gnu"*) ;;
              *) echo "LD_LIBRARY_PATH=$HOME/.local/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV" ;;
            esac
            export LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            # The probe result only feeds Linux bundle metadata (AppImage/deb),
            # which this NSIS-only Windows job never produces, so a stub .pc is
            # sufficient to make tauri-cli's probe succeed. PKG_CONFIG_PATH is
            # searched before system dirs, hence the --exists gate to avoid
            # shadowing a genuine system install.
            PC_DIR="$HOME/.local/usr/lib/pkgconfig"
            export PKG_CONFIG_PATH="$PC_DIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "PKG_CONFIG_PATH=$PC_DIR" >> "$GITHUB_ENV"
            if ! pkgconf --exists ayatana-appindicator3-0.1 \
              && ! pkgconf --exists appindicator3-0.1; then
              mkdir -p "$PC_DIR"
              cat > "$PC_DIR/ayatana-appindicator3-0.1.pc" <<EOF
          prefix=$HOME/.local/usr
          libdir=\${prefix}/lib

          Name: ayatana-appindicator3-0.1
          Description: Stub module for tauri-cli tray probe (NSIS-only cross build)
          Version: 0.5.90
          Libs: -L\${prefix}/lib
          EOF
              echo "wrote appindicator stub: $PC_DIR/ayatana-appindicator3-0.1.pc"
            fi
            pkgconf --exists ayatana-appindicator3-0.1 \
              || pkgconf --exists appindicator3-0.1 \
              || { echo "::error::appindicator pkg-config probe still failing"; exit 1; }
          }
          ensure_pkgconfig

          if ! command -v cargo &>/dev/null; then
            # rustup installs to ~/.cargo/$HOME/.rustup with no sudo, matching
            # the userspace toolchain pattern above. Cached on the persistent
            # runner home between releases, so this only pays once.
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              echo "cargo not found — installing rustup (minimal profile, stable) into $HOME/.cargo"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
            else
              echo "cargo exists at $HOME/.cargo/bin but not on PATH"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          command -v cargo &>/dev/null \
            || { echo "::error::cargo still missing after rustup install attempt"; exit 1; }
          # cargo-xwin = MSVC cross-compile runner, tauri-cli = tauri build.
          # Installs are slow (~5-10 min each) but cached on the self-hosted
          # runner's persistent ~/.cargo between releases.
          command -v cargo-xwin &>/dev/null || cargo install --locked cargo-xwin
          # Pin tauri-cli for reproducible bundler/updater behavior (the
          # persistent runner home may cache an older CLI indefinitely).
          # v2 updater mode (createUpdaterArtifacts: true) signs the raw
          # NSIS installer in place; no nsis.zip is produced on Windows.
          TAURI_CLI_PIN=2.11.4
          tauri_ver=$(cargo tauri --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -z "$tauri_ver" ] || [ "$(printf '%s\n%s\n' "$tauri_ver" "$TAURI_CLI_PIN" | sort -V | head -1)" != "$TAURI_CLI_PIN" ]; then
            cargo install --locked tauri-cli --version "$TAURI_CLI_PIN" --force
          fi
          echo "tauri-cli: $(cargo tauri --version)"
          rustup target list --installed | grep -q '^x86_64-pc-windows-msvc$' || rustup target add x86_64-pc-windows-msvc

          for tool in makensis llvm-rc cargo-xwin cargo-tauri; do
            if ! command -v "$tool" &>/dev/null; then
              echo "::error::$tool missing — install it on the runner."
              exit 1
            fi
          done
          echo "Tauri Windows toolchain OK"
      - name: Build NSIS path-redirect shim
        run: |
          set -euo pipefail
          # makensis resolves Stubs/Plugins/Include against /usr/share/nsis
          # compiled into the binary (NSISDIR env is ignored), which does not
          # exist on this root-less runner. The LD_PRELOAD shim
          # (ci/libnsisredirect.c) transparently rewrites /usr/share/nsis/* to
          # $NSIS_REAL_DIR (the userspace deb extraction); a rewritten access
          # failing with ENOENT falls back to the original path. Skipped when
          # only a system NSIS is present (its /usr/share/nsis tree works as
          # compiled in).
          NSIS_TREE="$HOME/.local/usr/share/nsis"
          if [ ! -d "$NSIS_TREE/Stubs" ]; then
            echo "no userspace NSIS tree at $NSIS_TREE; shim skipped (system NSIS)"
            exit 0
          fi
          CC_BIN=$(command -v cc || command -v gcc || command -v clang || true)
          if [ -z "$CC_BIN" ]; then
            echo "::error::no C compiler (cc/gcc/clang) for the NSIS redirect shim"
            exit 1
          fi
          SO="$RUNNER_TEMP/libnsisredirect.so"
          "$CC_BIN" -shared -fPIC -O2 -Wall -Wextra -Werror \
            -o "$SO" ci/libnsisredirect.c -ldl
          # Only reached by the userspace install; persist for later steps
          # (in-process exports do not survive across steps).
          echo "NSIS_REAL_DIR=$NSIS_TREE" >> "$GITHUB_ENV"
          echo "NSIS_LD_PRELOAD=$SO" >> "$GITHUB_ENV"
          echo "NSIS redirect shim ready: $SO ($(wc -c < "$SO") bytes, root: $NSIS_TREE)"
      - name: Build Tauri NSIS (Windows setup.exe)
        working-directory: apps/desktop/src-tauri
        env:
          # Updater signing (minisign). TAURI_SIGNING_PRIVATE_KEY holds the
          # base64 body of apps/desktop/.updater-keys/jait-updater.key;
          # the key was generated with an empty password. `createUpdaterArtifacts`
          # (v2 updater mode) makes the bundler sign the NSIS installer in
          # place: Jait_*_x64-setup.exe + Jait_*_x64-setup.exe.sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not configured (content of apps/desktop/.updater-keys/jait-updater.key)"
            exit 1
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          # ring 0.17's C code takes `#include <stdalign.h>` when compiled with
          # clang-cl (defines both _MSC_VER and __clang__), but the UCRT headers
          # xwin downloads never shipped stdalign.h (MSVC treats alignas/alignof
          # as keywords). Write a C11-compat shim into the xwin UCRT include
          # dir; idempotent, cached on the persistent runner home.
          XWIN_UCRT="$HOME/.cache/cargo-xwin/xwin/sdk/include/ucrt"
          if [ ! -f "$XWIN_UCRT/stdalign.h" ]; then
            test -d "$XWIN_UCRT" || { echo "::error::xwin ucrt dir missing: $XWIN_UCRT"; exit 1; }
            cat > "$XWIN_UCRT/stdalign.h" <<'EOF'
          #ifndef _STDALIGN_H
          #define _STDALIGN_H
          #ifndef __cplusplus
          #define alignas _Alignas
          #define alignof _Alignof
          #endif
          #define __alignas_is_defined 1
          #define __alignof_is_defined 1
          #endif /* _STDALIGN_H */
          EOF
            echo "wrote stdalign.h shim: $XWIN_UCRT/stdalign.h"
          fi
          # NSIS_LD_PRELOAD/NSIS_REAL_DIR are set by the shim step above when
          # the userspace NSIS tree is in use; tauri-cli spawns makensis, which
          # inherits LD_PRELOAD and gets its /usr/share/nsis paths redirected.
          export LD_PRELOAD="${NSIS_LD_PRELOAD:-}"
          export NSIS_REAL_DIR="${NSIS_REAL_DIR:-}"
          cargo tauri build --config tauri.gateway.conf.json --features shell,frontend --runner cargo-xwin \
            --target x86_64-pc-windows-msvc --bundles nsis
      - name: Generate desktop updater manifest (latest.json)
        run: |
          # The Tauri updater polls .../releases/latest/download/latest.json
          # (static feed consumed by the desktop updater).
          # With createUpdaterArtifacts: true (v2 updater mode) the bundler
          # signs the NSIS installer in place: *-setup.exe + *-setup.exe.sig.
          # The sig is copied verbatim from that .exe.sig; the download URL
          # points at the tagged release asset.
          NSIS_DIR=apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          EXE=$(ls "$NSIS_DIR"/*-setup.exe | head -n1)
          SIG=$(ls "$NSIS_DIR"/*-setup.exe.sig | head -n1)
          test -s "$EXE" || { echo "::error::updater installer not found in $NSIS_DIR"; exit 1; }
          test -s "$SIG" || { echo "::error::updater signature not found in $NSIS_DIR (createUpdaterArtifacts?)"; exit 1; }
          VERSION="${{ env.desktop_release_version }}"
          PUBKEY="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEI0RThDQzkwMDZGMjg4NDYKUldSR2lQSUdrTXpvdEhuWkVYRU5idGtMRXpDZy8weXY3OWsrRmdZSUk5cUxUdHlFRlVOUmR1dXkK"
          jq -n --arg v "$VERSION" --arg pk "$PUBKEY" \
                --arg sig "$(cat "$SIG")" \
                --arg url "https://github.com/Widev-e-U/Jait/releases/download/v$VERSION/$(basename "$EXE")" \
                '{version: $v, notes: "Jait desktop", pubkey: $pk,
                  platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > "$NSIS_DIR/latest.json"
          cp -v "$EXE" "$SIG" "$RELEASE_ASSET_DIR"/
          echo "latest.json ->"; cat "$NSIS_DIR/latest.json"
      - name: Stage desktop release assets on runner
        if: env.RELEASE_ASSET_MODE == 'runner'
        run: |
          NSIS_DIR=apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          cp -v "$NSIS_DIR"/*-setup.exe "$NSIS_DIR"/*-setup.exe.sig \
                "$NSIS_DIR/latest.json" \
                "$RELEASE_ASSET_DIR"/
      - name: Upload desktop release assets to GitHub Artifacts
        if: env.RELEASE_ASSET_MODE == 'github-artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-assets
          retention-days: ${{ env.RELEASE_ASSET_RETENTION_DAYS }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json

  # ── Build Android APK ──────────────────────────────────────────────
  android:
    name: Android APK
    runs-on: [self-hosted, linux]
    needs: [auto-tag]
    if: |
      always() && (
        needs.auto-tag.outputs.mobile_changed == 'true' ||
        needs.auto-tag.outputs.changed == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
      && (
        github.event_name != 'push' ||
        github.ref != 'refs/heads/main' ||
        needs.auto-tag.outputs.changed == 'true'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare release asset directory
        run: mkdir -p "$RELEASE_ASSET_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android SDK already installed — skipping download"
          else
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Configure Firebase Android client
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || { echo "::error::FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 is not configured"; exit 1; }
          printf "%s" "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > apps/mobile/android/app/google-services.json
      - name: Capacitor sync
        working-directory: apps/mobile
        run: bunx cap sync android
      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > apps/mobile/android/local.properties
      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is not configured"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is not configured"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/jait-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "JAIT_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: apps/mobile/android
        env:
          JAIT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAIT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAIT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Verify and name Android APK
        run: |
          APK_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          VERSION=$(jq -r '.version' packages/gateway/package.json)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          mkdir -p apps/mobile/android/app/build/outputs/release-assets
          cp "$APK_PATH" "apps/mobile/android/app/build/outputs/release-assets/Jait-$VERSION-android.apk"
      - name: Verify and name Wear APK
        run: |
          APK_PATH="apps/mobile/android/wear/build/outputs/apk/release/wear-release.apk"
          VERSION=$(jq -r '.version' packages/gateway/package.json)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          cp "$APK_PATH" "apps/mobile/android/app/build/outputs/release-assets/Jait-$VERSION-wear.apk"
      - name: Stage Android release assets on runner
        if: env.RELEASE_ASSET_MODE == 'runner'
        run: cp -v apps/mobile/android/app/build/outputs/release-assets/*.apk "$RELEASE_ASSET_DIR"/
      - name: Upload Android release assets to GitHub Artifacts
        if: env.RELEASE_ASSET_MODE == 'github-artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          retention-days: ${{ env.RELEASE_ASSET_RETENTION_DAYS }}
          if-no-files-found: error
          path: apps/mobile/android/app/build/outputs/release-assets/*.apk
      - name: Remove Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jait-release.keystore"

  # ── Publish npm packages (in dependency order) ─────────────────────
  npm-publish:
    name: Publish npm packages
    runs-on: [self-hosted, linux]
    needs: [auto-tag]
    if: |
      always() && (
        needs.auto-tag.outputs.tagged == 'true' ||
        needs.auto-tag.outputs.changed == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build

      # 1. Publish @jait/shared (no workspace deps)
      #
      # Deliberately NOT gated on `shared_changed`: that gate is what broke
      # v0.1.852–v0.1.857. A run that failed before reaching this step (setup-bun
      # 502 on v0.1.852) left shared@0.1.83 unpublished, while every later run saw
      # `shared_changed=false`, skipped the publish, and still shipped a gateway
      # declaring `"@jait/shared": "^0.1.83"`. The published gateway was therefore
      # not installable (`npm install -g` → ETARGET) and every operator's "Update"
      # button failed. Publishing unconditionally costs a few seconds: an
      # already-published version exits 409 and is skipped below.
      - name: Publish @jait/shared
        working-directory: packages/shared
        run: |
          # A 409 here means the version was already published (e.g. the tag
          # push run beat this main-push run to it) — skip, don't fail.
          # npm >=10 wording: "Cannot publish over previously staged version".
          npm publish --access public 2>&1 | tee "/tmp/npm-out-${{ github.run_id }}.log"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            if grep -qi 'EPUBLISHCONFLICT\|cannot publish over' "/tmp/npm-out-${{ github.run_id }}.log"; then
              echo "⏭ Already published — skipping"
            else
              cat "/tmp/npm-out-${{ github.run_id }}.log"; exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. Publish @jait/screen-share (depends on shared)
      # Same reasoning as @jait/shared above: never gate a package on its own
      # version bump, otherwise a later gateway release can point at a
      # screen-share/shared version that no run ever published.
      - name: Resolve workspace deps (screen-share)
        working-directory: packages/screen-share
        run: |
          VERSION=$(jq -r '.version' ../shared/package.json)
          jq --arg v "^$VERSION" '.dependencies["@jait/shared"] = $v' package.json > tmp.json && mv tmp.json package.json
      - name: Publish @jait/screen-share
        working-directory: packages/screen-share
        run: |
          # A 409 here means the version was already published (e.g. the tag
          # push run beat this main-push run to it) — skip, don't fail.
          # npm >=10 wording: "Cannot publish over previously staged version".
          npm publish --access public 2>&1 | tee "/tmp/npm-out-${{ github.run_id }}.log"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            if grep -qi 'EPUBLISHCONFLICT\|cannot publish over' "/tmp/npm-out-${{ github.run_id }}.log"; then
              echo "⏭ Already published — skipping"
            else
              cat "/tmp/npm-out-${{ github.run_id }}.log"; exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 3. Bundle web frontend into gateway package (no separate @jait/web publish)
      - name: Bundle web dist into gateway
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        run: |
          rm -rf packages/gateway/web-dist
          cp -r apps/web/dist packages/gateway/web-dist
          echo "✅ Bundled web frontend into packages/gateway/web-dist"

      # 4. Publish @jait/gateway (depends on shared + screen-share, web bundled inside)
      - name: Resolve workspace deps (gateway)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        working-directory: packages/gateway
        run: |
          SHARED_V=$(jq -r '.version' ../shared/package.json)
          SCREEN_V=$(jq -r '.version' ../screen-share/package.json)
          jq --arg sv "^$SHARED_V" --arg scv "^$SCREEN_V" \
            '.dependencies["@jait/shared"] = $sv | .dependencies["@jait/screen-share"] = $scv | del(.dependencies["@jait/web"])' \
            package.json > tmp.json && mv tmp.json package.json

      # 4b. Fail BEFORE publishing if any workspace range does not resolve on the
      # registry. A published version cannot be un-published, and
      # gateway@0.1.857 shipped with an unsatisfiable `^0.1.83` shared range that
      # no amount of retrying could install. Checking here turns "every operator's
      # update fails forever" into a red CI run on the offending commit.
      - name: Verify gateway dependency ranges resolve on the registry
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        working-directory: packages/gateway
        run: |
          set -euo pipefail
          # Run npm from /tmp, never from a workspace member: npm aborts with
          # ENOWORKSPACES ("This command does not support workspaces") inside a
          # workspace, which previously killed this style of step instantly.
          DEPS=$(jq -r '.dependencies | keys[] | select(startswith("@jait/"))' package.json)
          # This step runs seconds after `Publish @jait/shared`, but npm returns
          # 200 from the publish PUT before the new version is visible through
          # every packument cache — a range published moments ago can still
          # resolve to nothing here. That race is exactly what failed the
          # v0.1.857 verify job while `@jait/shared` was in fact on its way.
          # Retry with backoff; a genuinely missing dependency still fails loud.
          missing=""
          for attempt in $(seq 1 20); do
            missing=""
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              range=$(jq -r --arg d "$dep" '.dependencies[$d]' package.json)
              live=$(cd /tmp && npm view "$dep@$range" version 2>/dev/null | tr -d '[:space:]' | tail -n1 || true)
              if [ -z "$live" ]; then
                missing="$missing $dep@$range"
              else
                echo "✅ $dep@$range → $live"
              fi
            done <<< "$DEPS"
            if [ -z "$missing" ]; then
              echo "✅ Every @jait/* dependency range resolves on the registry."
              exit 0
            fi
            echo "⏳ attempt $attempt/20 — not resolvable yet:${missing} (waiting for registry propagation)"
            sleep 30
          done
          for d in $missing; do
            echo "::error::$d is not resolvable on the registry — gateway would be uninstallable"
          done
          echo "Refusing to publish an uninstallable gateway. Publish the missing workspace package(s) first."
          exit 1

      - name: Publish @jait/gateway
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        working-directory: packages/gateway
        run: |
          # A 409 here means the version was already published (e.g. the tag
          # push run beat this main-push run to it) — skip, don't fail.
          # npm >=10 wording: "Cannot publish over previously staged version".
          npm publish --access public 2>&1 | tee "/tmp/npm-out-${{ github.run_id }}.log"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            if grep -qi 'EPUBLISHCONFLICT\|cannot publish over' "/tmp/npm-out-${{ github.run_id }}.log"; then
              echo "⏭ Already published — skipping"
            else
              cat "/tmp/npm-out-${{ github.run_id }}.log"; exit $status
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 5. Confirm the version is actually retrievable from the registry.
      # npm can exit 0 and still leave the upload *staged*: newer npm prints
      # "Your package is being processed and may take a few minutes to become
      # available", and the registry only commits the version minutes later
      # (v0.1.850 needed ~6 min). Two failure modes are guarded here:
      #   - a version that never lands at all (v0.1.849 shipped its GitHub
      #     release while npm never got the version), and
      #   - a fix that gives up too early and cost v0.1.850 its release.
      # So: poll generously, re-publish periodically (a repeated publish is
      # what nudges the registry to commit the staged version), and fail loudly
      # only when the version really is not installable for operators.
      - name: Verify @jait/gateway on the registry
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        working-directory: packages/gateway
        run: |
          # The verification is deliberately fail-loud; only the polling below
          # should decide the step outcome, so no `-e` surprises from helpers.
          set +e
          VERSION=$(jq -r '.version' package.json)
          REGISTRY="${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}"
          LOG="/tmp/npm-verify-${{ github.run_id }}.log"
          echo "Verifying @jait/gateway@$VERSION via $REGISTRY"
          # Ask npm itself first: it is the client that published, it honours the
          # runner's configured registry/proxy, and it reads through the same
          # path operators use. A bare curl to registry.npmjs.org is not a
          # reliable witness on its own.
          # NOTE: run npm from /tmp, not from this workspace member —
          # `npm config`-style commands abort with ENOWORKSPACES ("This command
          # does not support workspaces") inside a workspace, which killed this
          # step instantly and left v0.1.851 unpublished.
          is_live() {
            if [ "$(cd /tmp && npm view "@jait/gateway@$VERSION" version 2>/dev/null | tr -d '[:space:]')" = "$VERSION" ]; then
              return 0
            fi
            # Fallback in case the configured registry is a mirror that lags.
            local code
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' \
              "https://registry.npmjs.org/@jait/gateway/$VERSION" 2>/dev/null)
            [ "$code" = "200" ]
          }
          for attempt in $(seq 1 60); do
            if is_live; then
              echo "✅ @jait/gateway@$VERSION is live on $REGISTRY (attempt $attempt)"
              exit 0
            fi
            # Re-publish every 2 minutes: a staged upload is committed once the
            # registry finishes processing, and a repeat publish either succeeds
            # or reports "cannot publish over ..." — both mean it is on its way.
            if [ $((attempt % 8)) -eq 0 ]; then
              echo "↻ @jait/gateway@$VERSION not visible yet — retrying publish"
              npm publish --access public 2>&1 | tee "$LOG" | tail -5
              grep -qi 'EPUBLISHCONFLICT\|cannot publish over' "$LOG" \
                && echo "   (registry reports it as already staged/published)"
            fi
            sleep 15
          done
          echo "❌ @jait/gateway@$VERSION is still absent after 15 minutes."
          echo "   npm accepted the upload but never committed the version."
          echo "   Not cutting a release for a version nobody can install."
          echo "--- last publish output ---"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 6. Prove the operator's exact command works. `npm view` only confirms the
      # version exists; it says nothing about whether its dependency ranges
      # resolve, which is how gateway@0.1.857 passed step 5 while being
      # impossible to install. This mirrors `npm install -g @jait/gateway@X`
      # (the update route) in a throwaway prefix with --ignore-scripts, so we
      # check dependency resolution without running install hooks.
      - name: Smoke-test `npm install -g @jait/gateway@$VERSION`
        if: github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.auto-tag.outputs.gateway_changed == 'true'
        working-directory: packages/gateway
        run: |
          set +e
          VERSION=$(jq -r '.version' package.json)
          PREFIX="$(mktemp -d)/prefix"
          mkdir -p "$PREFIX"
          LOG="/tmp/npm-install-${{ github.run_id }}.log"
          echo "Installing @jait/gateway@$VERSION into $PREFIX (dependency resolution only)"
          cd /tmp
          # A freshly published dependency range can 404 (ETARGET) for a few
          # minutes while the packument propagates, so retry before declaring
          # the package uninstallable.
          for attempt in $(seq 1 12); do
            npm install --global --prefix "$PREFIX" --ignore-scripts --no-audit --no-fund \
              "@jait/gateway@$VERSION" 2>&1 | tee "$LOG"
            status=${PIPESTATUS[0]}
            [ $status -eq 0 ] && break
            if grep -qi 'ETARGET\|404\|not in this registry\|may take a few minutes' "$LOG"; then
              echo "⏳ attempt $attempt/12 — dependencies not propagated yet, retrying in 30s"
              rm -rf "$PREFIX"; mkdir -p "$PREFIX"
              sleep 30
            else
              break
            fi
          done
          if [ $status -ne 0 ]; then
            echo "::error::@jait/gateway@$VERSION is published but NOT installable — operator updates will fail."
            echo "This usually means a workspace dependency range (e.g. @jait/shared) was never published."
            grep -i 'ETARGET\|404\|not in this registry' "$LOG" || true
            exit $status
          fi
          echo "✅ @jait/gateway@$VERSION installs cleanly"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Create GitHub Release with all assets ──────────────────────────
  release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux]
    needs: [auto-tag, npm-publish, desktop, android]
    if: |
      always() && 
      needs.npm-publish.result == 'success' && 
      contains(fromJSON('["success","skipped"]'), needs.desktop.result) && 
      contains(fromJSON('["success","skipped"]'), needs.android.result) && (
        needs.auto-tag.outputs.tagged == 'true' ||
        needs.auto-tag.outputs.changed == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release asset directory
        run: mkdir -p "$RELEASE_ASSET_DIR"
      - name: Download GitHub Artifacts
        if: env.RELEASE_ASSET_MODE == 'github-artifacts'
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.RELEASE_ASSET_DIR }}
          merge-multiple: true
      - name: Verify staged release assets
        if: env.RELEASE_ASSET_MODE == 'runner'
        run: |
          test -d "$RELEASE_ASSET_DIR"
          ls -lah "$RELEASE_ASSET_DIR"
      - name: Verify downloaded release assets
        if: env.RELEASE_ASSET_MODE == 'github-artifacts'
        run: ls -lah "$RELEASE_ASSET_DIR"

      - name: Extract version
        id: version
        run: |
          # Prefer auto-tag output, fall back to tag ref or package.json
          if [ -n "${{ needs.auto-tag.outputs.version }}" ]; then
            echo "version=${{ needs.auto-tag.outputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(jq -r '.version' packages/gateway/package.json)" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release and recreate
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          echo "Cleaning up release $TAG"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" 2>&1 || echo "No existing release for $TAG — nothing to delete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Jait v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ASSET_DIR }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-hosted runner sits behind a TLS-intercepting proxy; Node does
          # not trust the OS CA store by default. Tell it to use the system
          # store (same roots gh and the shell already trust) so asset uploads
          # to api.github.com don't fail with "self-signed certificate".
          NODE_OPTIONS: --use-system-ca

      - name: Clean up staged release assets
        if: always()
        run: rm -rf "$RELEASE_ASSET_DIR"