[workspace]
members = ["."]
resolver = "3"

[package]
name = "jait-gateway"
default-run = "jait-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
ed25519-dalek = "2"
icu_collator = "2"
libc = "0.2"
ryu-js = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate", "zstd"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
url = "2.5"
percent-encoding = "2.3"
scrypt = { version = "0.11", default-features = false }
getrandom = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
subtle = "2.6"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["rust_crypto"] }
base64 = "0.22"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.0", features = ["v4"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "preserve_order", "float_roundtrip"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
regress = { version = "0.12.0", features = ["utf16"] }

[build-dependencies]
serde_json = { version = "1.0", features = ["raw_value", "preserve_order", "float_roundtrip"] }

[profile.dev]
debug = 0

# Retain unwinding so worker failures remain observable and cleanup can run.
# Compare these settings with the default profile using the same workload.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[dev-dependencies]
tokio = { version = "1.0", features = ["test-util"] }
